<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practicaJavascript</title>
    <style>
        #tarjeta {
            margin-top: 30px;
            padding: 20px;
            width: 280px;
            border: 1px solid #999;
            text-align: center;
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Mi primera web</h1>
    <p id="mensaje">Esta es una página de ejemplo para practicar JavaScript.</p>
    <button id="miBoton">Cambiar mensaje</button>
    <form id="formularioNombre">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">
        <input type="button" id="botonEnviar" value="Enviar">
    </form>
    <section id="tarjeta">
        <h2>Personaliza tu tarjeta</h2>
        <p>¡Bienvenido a mi aplicación web!</p>
        <button id="colorAzul" type="button">Azul</button>
        <button id="colorVerde" type="button">Verde</button>
        <button id="colorRojo" type="button">Rojo</button>
        <button id="restablecer" type="button">Restablecer</button>
    </section>
    <script src="js/app.js"></script>
</body>
</html>
